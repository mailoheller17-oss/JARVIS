<!doctype html>
<html lang="de" data-skin="ironman">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Jarvis</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon.svg">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/style.css">
<script>try{document.documentElement.dataset.skin=JSON.parse(localStorage.getItem("jarvisSkin"))||"ironman"}catch(e){}</script>
</head>
<body>
<!-- Login -->
<section id="login" hidden>
  <div class="orb small"><i></i><i></i><i></i><b></b></div>
  <h1>JARVIS</h1>
  <form id="loginForm">
    <input id="tokenInput" type="password" placeholder="Zugangs-Token" autocomplete="current-password" required>
    <button>Rein</button>
  </form>
  <p class="hint" id="loginHint">Token steht im Terminal (web/start.sh).</p>
</section>

<!-- App -->
<main id="app" hidden>
  <header>
    <span class="brand">JARVIS</span>
    <span id="provider" class="pill">…</span>
    <button id="ttsToggle" class="icon" title="Vorlesen an/aus">🔊</button>
    <button id="logout" class="icon" title="Abmelden">⏻</button>
  </header>

  <div class="orb" id="orb"><i></i><i></i><i></i><b></b></div>

  <nav class="tiles">
    <button data-tile="chat" class="active">💬<span>Chat</span></button>
    <button data-tile="edit">🎬<span>Edit</span></button>
    <button data-tile="learn">🧠<span>Lernen</span></button>
    <button data-tile="money">💰<span>Geld</span></button>
    <button data-tile="status">📡<span>Status</span></button>
    <button data-tile="konnektoren">🔌<span>Konnekt.</span></button>
    <button data-tile="settings">⚙️<span>Design</span></button>
  </nav>

  <section id="panel-money" class="panel" hidden>
    <h2>Sparziel</h2>
    <div class="row">
      <input id="goalName" placeholder="Wofür? (z.B. Kamera)">
      <input id="goalAmount" type="number" inputmode="decimal" placeholder="Ziel €">
    </div>
    <div class="bar"><div id="goalBar"></div></div>
    <p id="goalText" class="hint"></p>
    <div class="row">
      <input id="moneyDelta" type="number" inputmode="decimal" placeholder="Betrag €">
      <button id="moneyAdd">+ Einzahlen</button>
      <button id="moneySub" class="ghost">− Abheben</button>
    </div>
  </section>

  <section id="panel-status" class="panel" hidden>
    <h2>Status</h2>
    <ul id="statusList"></ul>
  </section>

  <section id="panel-konnektoren" class="panel" hidden>
    <h2>Konnektoren</h2>
    <p class="hint" id="brainInfo"></p>
    <div id="konList"></div>
  </section>

  <section id="panel-settings" class="panel" hidden>
    <h2>Einstellungen</h2>
    <div class="row">
      <label for="skinSelect" class="hint" style="align-self:center">Design</label>
      <select id="skinSelect">
        <option value="ironman">Iron-Man-Blau</option>
        <option value="minimal">Dunkel-Minimal</option>
        <option value="neon">Neon-Gaming</option>
      </select>
    </div>
    <p class="hint">Stimme: ElevenLabs → Edge-TTS → Browser (automatisch). <a href="/vorschau" style="color:var(--cyan)">Alle Vorschaubilder ansehen</a></p>
  </section>

  <div class="chips" id="chips"></div>
  <section id="chat" aria-live="polite"></section>

  <form id="chatForm">
    <button type="button" id="mic" class="icon" title="Sprechen">🎤</button>
    <input id="msg" placeholder="Sag was, Mailo…" autocomplete="off" enterkeyhint="send">
    <button id="send" class="icon" title="Senden">➤</button>
  </form>
</main>

<script src="/static/app.js"></script>
</body>
</html>
